version: '3.8'

services:
  # 1. Back-End Service (Nest.js)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wedding-be
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
    restart: always

  # 2. Front-End Service (Next.js)
  nextjs:
    build:
      context: ../fe
      dockerfile: Dockerfile
    container_name: wedding-fe
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api # Hoặc trỏ qua Nginx
    depends_on:
      - backend
    restart: always

  # 3. Nginx Reverse Proxy (Cổng chào điều hướng)
  nginx:
    image: nginx:alpine
    container_name: wedding-nginx
    ports:
      - "80:80"
    volumes:
      - ../fe/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nextjs
      - backend
    restart: always
